<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join | Abuja Chamber of Commerce</title>

    <meta name="description"
        content="Apply to join the Abuja Chamber of Commerce and explore networking, training, and business growth opportunities in Abuja.">

    <meta name="author" content="Magdalene Shehu">

    <meta property="og:title" content="Join the Abuja Chamber of Commerce Today">

    <meta property="og:description"
        content="Become a member of the Abuja Chamber of Commerce to access networking opportunities, business training, and community partnerships in Abuja.">

    <meta property="og:image" content="https://mshehu22.github.io/wdd231/chamber/images/abuja-chamber.jpg">

    <meta property="og:url" content="https://mshehu22.github.io/wdd231/chamber/join.html">

    <meta property="og:type" content="website">

    <link rel="icon" href="../favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../styles/normalize.css">
    <link rel="stylesheet" href="styles/directory.css">
    <link rel="stylesheet" href="styles/join.css">

    <script src="scripts/join.js" defer></script>
</head>

<body>

    <header>
        <div class="brand">
            <img src="images/chamber.jpg" alt="Abuja Chamber of Commerce Logo" width="80" height="80">
        </div>

        <button id="menu" aria-label="Open Navigation Menu">
            ☰
        </button>

        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="directory.html">Directory</a>
            <a href="discover.html">Discover</a>
            <a class="active" href="join.html">Join</a>
        </nav>
    </header>

    <main class="join-container">

        <section class="form-section">

            <h1>Join Abuja Chamber of Commerce</h1>

            <form method="get" action="thankyou.html">

                <label for="fname">
                    First Name
                </label>
                <input id="fname" type="text" name="fname" required title="First Name" autocomplete="given-name">

                <label for="lname">
                    Last Name
                </label>
                <input id="lname" type="text" name="lname" required title="Last Name" autocomplete="family-name">

                <label for="orgtitle">
                    Organizational Title
                </label>
                <input id="orgtitle" type="text" name="orgtitle" title="Organization Title"
                    autocomplete="organization-title" pattern="[A-Za-z\s\-]{7,}">

                <label for="email">
                    Email Address
                </label>
                <input id="email" type="email" name="email" required title="Email Address" autocomplete="email"
                    placeholder="example@email.com">

                <label for="phone">
                    Mobile Phone
                </label>
                <input id="phone" type="tel" name="phone" required title="Phone Number" autocomplete="tel">

                <label for="organization">
                    Business Name
                </label>
                <input id="organization" type="text" name="organization" required title="Business Name"
                    autocomplete="organization">

                <label for="membership">
                    Membership Level
                </label>
                <select id="membership" name="membership" required>

                    <option value="">
                        Select Membership
                    </option>

                    <option value="np">
                        NP Membership
                    </option>

                    <option value="bronze">
                        Bronze Membership
                    </option>

                    <option value="silver">
                        Silver Membership
                    </option>

                    <option value="gold">
                        Gold Membership
                    </option>

                </select>

                <label for="description">
                    Business Description
                </label>

                <textarea id="description" name="description" title="Business Description"></textarea>

                <input type="hidden" id="timestamp" name="timestamp">

                <button type="submit">
                    Apply for Membership
                </button>

            </form>

        </section>

        <section class="membership-cards">

            <div class="card">
                <h2>NP Membership</h2>
                <button id="npBtn">Learn More</button>
            </div>

            <div class="card">
                <h2>Bronze Membership</h2>
                <button id="bronzeBtn">Learn More</button>
            </div>

            <div class="card">
                <h2>Silver Membership</h2>
                <button id="silverBtn">Learn More</button>
            </div>

            <div class="card">
                <h2>Gold Membership</h2>
                <button id="goldBtn">Learn More</button>
            </div>

        </section>

    </main>

    <footer>
        <p>Abuja Chamber of Commerce</p>
        <p>© <span id="year"></span> Magdalene Shehu</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
